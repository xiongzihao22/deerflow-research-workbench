[project]
name = "deerflow-extension-research-workbench"
version = "0.1.0"
description = "Evidence-based competitor research workspace for DeerFlow"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3"]

[project.entry-points."deerflow.extensions"]
research-workbench = "deerflow_extension_research:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_research"]
